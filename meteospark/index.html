<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset = "UTF-8" />
    <meta name="viewport" content ="width=device-width, initial-scale=1.0">
    <title>MeteoSpark</title>
  </head>

  <body class="bg-gradient-to-r from-green-200 to-cyan-200 flex items-center justify-center min-h-screen font-sans text-slate-800">

    <div id="auth-block" class="w-full max-w-md p-8 bg-slate-200 w-full rounded-xl max-w-d p-5 bg-gray-200 shadow-lg mx-4">

      <div class="text-center mb-8">
        <h1 class="text-[50px] font-bold text-green-800 mb-2">MeteoSpark</h1>
        <p class="text-[20px] text-black">Learn about weather. Time to spark!</p>
      </div>

      <form id="auth-form" class="space-y-3" onsubmit="event.preventDefault();">

        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input type="email" id="email" required 
            class="w-full px-4 py-2 border border-slate-900 rounded-lg focus:ring-2 outline-none transition-all" 
            placeholder="hello@example.com">
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input type="password" id="password" required 
            class="w-full px-4 py-2 border border-slate-900 rounded-lg focus:ring-2 outline-none transition-all" 
            placeholder="••••••••">
        </div>

        <p id="auth-message" class="text-sm text-center hidden"></p>

        <div class="flex flex-col gap-3 pt-4">
          <button id="btn-login" type="button" class="text-[20px] px-8 py-4 bg-gradient-to-r from-green-500 to-cyan-500 text-white font-bold rounded-full transition-transform transform-gpu hover:-translate-y-1 hover:shadow-lg">Sign In</button>
          
          <div class="relative flex py-2 items-center">
            <div class="flex-grow border-t border-slate-200"></div>
            <span class="flex-shrink-0 mx-4 text-slate-400 text-[20px]">If you don't have an account, then..</span>
            <div class="flex-grow border-t border-slate-200"></div>
          </div>

          <button id="btn-register" type="button" class="text-[20px] px-8 py-4 bg-gradient-to-r from-green-500 to-cyan-500 text-white font-bold rounded-full transition-transform transform-gpu hover:-translate-y-1 hover:shadow-lg">Create an Account</button>
        </div>

      </form>
    </div>

    <div id="dashboard-container" class="hidden w-full min-h-screen bg-green-200 dark:bg-gray-500">
      
      <nav class="bg-white dark:bg-black shadow-sm px-4 py-3 flex justify-between items-center sticky top-0 z-10">
        <h1 class="text-[40px] text-center font-bold text-blue-600 tracking-tight">MeteoSpark</h1>
        <div class="flex items-center gap-3">
          <span id="user-email-display" class="text-sm text-slate-600 dark:text-white hidden sm:block"></span>
          <button id="btn-toggle-dark" class="text-sm bg-black font-medium text-white dark:text-slate-300 px-3 py-1.5 rounded-lg hover:-translate-y-0.5 dark:hover:bg-purple-800 transition-colors">
            Dark Mode
          </button>
          <button id="btn-logout" class="text-sm bg-slate-100 text-slate-700 font-medium px-3 py-1.5 rounded-lg hover:-translate-y-0.5 hover:bg-red-50 hover:text-red-600 transition-colors">
            Sign Out
          </button>
        </div>
      </nav>

      <main class="max-w-4xl mx-auto p-4 pt-8">
        <h2 class="text-[50px] text-center font-bold text-slate-800 mb-6">Choose your activity</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          
          <button id="btn-learn" class="text-[20px] px-20 py-50 bg-gradient-to-r from-green-500 to-cyan-500 font-bold rounded-2xl transition-transform transform-gpu hover:-translate-y-1 hover:shadow-lg">
            <h3 class="text-[35px] font-bold text-slate-800">Learn</h3>
            <p class="text-[15px] text-black mt-1">Study the weather. The place to gain knowledge!</p>
          </button>

          <button id="btn-game" class="text-[20px] px-20 py-50 bg-gradient-to-r from-green-500 to-cyan-500 text-white font-bold rounded-2xl transition-transform transform-gpu hover:-translate-y-1 hover:shadow-lg">
            <h3 class="text-[35px] font-bold text-slate-800">Game</h3>
            <p class="text-[15px] text-black mt-1">Test your knowledge with flashcards and active recall.</p>
          </button>

          <button id="btn-predict" class="text-[20px] px-20 py-50 bg-gradient-to-r from-green-500 to-cyan-500 text-white font-bold rounded-2xl transition-transform transform-gpu hover:-translate-y-1 hover:shadow-lg">
            <h3 class="text-[35px] font-bold text-slate-800">Predict</h3>
            <p class="text-[15px] text-black mt-1">Explore ML-driven forecasts and historical data.</p>
          </button>

        </div>
      </main>
    </div>

    <div id="learn-container" class="hidden w-full min-h-screen bg-slate-50 dark:bg-gray-500">
      <nav class="bg-white dark:bg-black shadow-sm px-4 py-3 flex items-center sticky top-0 z-10">
        <button id="btn-back" class="flex items-center gap-2 text-blue-600 hover:text-blue-800 font-medium mr-4 transition-colors">
          Back
        </button>

        <h1 class="text-[40px] font-bold text-slate-800 dark:text-white">Learn Meteorology</h1>
      </nav>

      <main class="max-w-4xl mx-auto p-4 pt-6">
        <div id="lesson-content" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
          <p class="text-slate-500 dark:bg-slate-250 italic">Select a module to begin learning...</p>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>

  </body>


</html>
